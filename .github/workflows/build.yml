name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      automate_home_branch:
        description: "automate-home branch to install"
        required: false
        default: "dev"
      lifx_lib_branch:
        description: "lifx-lib branch to install"
        required: false
        default: "dev"

jobs:
  resolve-branches:
    runs-on: ubuntu-latest
    outputs:
      automate_home_branch: ${{ steps.resolve.outputs.automate_home_branch }}
      lifx_lib_branch: ${{ steps.resolve.outputs.lifx_lib_branch }}
    steps:
      - name: Resolve companion repo branches
        id: resolve
        env:
          REQUESTED_HOME_BRANCH: ${{ github.event.inputs.automate_home_branch || github.base_ref || github.ref_name || 'dev' }}
          REQUESTED_LIFX_BRANCH: ${{ github.event.inputs.lifx_lib_branch || github.base_ref || github.ref_name || 'dev' }}
        run: |
          resolve() {
            local repo="$1" branch="$2"
            if git ls-remote --exit-code --heads "https://github.com/majamassarini/${repo}.git" "$branch" > /dev/null 2>&1; then
              echo "$branch"
            else
              echo "main"
            fi
          }

          echo "automate_home_branch=$(resolve automate-home "$REQUESTED_HOME_BRANCH")" >> "$GITHUB_OUTPUT"
          echo "lifx_lib_branch=$(resolve lifx-lib "$REQUESTED_LIFX_BRANCH")" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve-branches
    runs-on: ubuntu-latest
    env:
      AUTOMATE_HOME_BRANCH: ${{ needs.resolve-branches.outputs.automate_home_branch }}
      LIFX_LIB_BRANCH: ${{ needs.resolve-branches.outputs.lifx_lib_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install --force-reinstall git+https://github.com/majamassarini/lifx-lib.git@${{ env.LIFX_LIB_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-home.git@${{ env.AUTOMATE_HOME_BRANCH }}

      - name: black
        run: black --check .

      - name: flake8
        run: flake8 lifx_plugin

      - name: mypy
        run: mypy lifx_plugin

  test:
    needs: resolve-branches
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      AUTOMATE_HOME_BRANCH: ${{ needs.resolve-branches.outputs.automate_home_branch }}
      LIFX_LIB_BRANCH: ${{ needs.resolve-branches.outputs.lifx_lib_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
          pip install --force-reinstall git+https://github.com/majamassarini/lifx-lib.git@${{ env.LIFX_LIB_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-home.git@${{ env.AUTOMATE_HOME_BRANCH }}

      - name: Run unit tests
        run: |
          python -m coverage run -m unittest discover \
            -s lifx_plugin/tests -p 'test*.py' -v

      - name: Run doctests
        run: |
          python -m doctest lifx_plugin/gateway.py -v
          python -m doctest lifx_plugin/message.py -v
          python -m doctest lifx_plugin/trigger.py -v
          python -m doctest lifx_plugin/command.py -v

      - name: Generate coverage report
        run: |
          python -m coverage report -m
          python -m coverage xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  docs:
    needs: resolve-branches
    runs-on: ubuntu-latest
    env:
      AUTOMATE_HOME_BRANCH: ${{ needs.resolve-branches.outputs.automate_home_branch }}
      LIFX_LIB_BRANCH: ${{ needs.resolve-branches.outputs.lifx_lib_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[docs]"
          pip install --force-reinstall git+https://github.com/majamassarini/lifx-lib.git@${{ env.LIFX_LIB_BRANCH }}
          pip install --force-reinstall git+https://github.com/majamassarini/automate-home.git@${{ env.AUTOMATE_HOME_BRANCH }}

      - name: Build docs
        run: make docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html/
